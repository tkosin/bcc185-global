<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ผจญภัยอวกาศ ตัวเลข</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space1:#241a52; --space2:#3d2a7a; --space3:#5b3fa8;
    --panel:#f5f1ff; --ink:#2c2350;
    --star:#ffd24d; --rocket:#ff5c7a; --alien:#3fe0c5; --nebula:#b06bff; --sky:#57c8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Mali',sans-serif;color:var(--ink);
    background:radial-gradient(circle at 30% 10%, #4a2f8f 0%, var(--space2) 35%, var(--space1) 100%);
    min-height:100dvh;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 14px 34px;user-select:none;position:relative;
  }
  /* starfield */
  .stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star-dot{position:absolute;background:#fff;border-radius:50%;opacity:.85;animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:.95;}}

  .wrap{width:100%;max-width:520px;position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;}

  header{text-align:center;}
  h1{font-family:'Itim',cursive;font-size:2rem;line-height:1.1;color:#fff;
     text-shadow:0 0 14px rgba(176,107,255,.8), 0 3px 0 #2a1f5a;}
  h1 .em{color:var(--star);text-shadow:0 0 14px rgba(255,210,77,.9),0 3px 0 #a9791f;}

  /* status bar (solo) */
  .bar{display:flex;justify-content:center;align-items:center;gap:10px;
       background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);
       border-radius:22px;padding:8px 16px;color:#fff;font-family:'Itim',cursive;font-size:1.2rem;}
  .bar .stars{letter-spacing:2px;font-size:1.3rem;}

  /* two-player scoreboard */
  .scoreboard{display:flex;gap:10px;}
  .pchip{flex:1;background:rgba(255,255,255,.12);border:3px solid transparent;border-radius:20px;
         padding:10px;text-align:center;color:#fff;font-family:'Itim',cursive;transition:.15s;}
  .pchip .who{font-size:1.15rem;} .pchip .pts{font-size:1.7rem;}
  .pchip.active{background:rgba(255,210,77,.22);border-color:var(--star);
                box-shadow:0 0 18px rgba(255,210,77,.5);transform:translateY(-2px);}

  .card{background:var(--panel);border-radius:28px;padding:22px 18px 24px;
        box-shadow:0 0 0 4px rgba(255,255,255,.15), 0 14px 30px rgba(0,0,0,.35);}

  /* HOME */
  .home-title{font-family:'Itim',cursive;font-size:1.5rem;text-align:center;}
  .home-sub{text-align:center;color:#8a7fb5;margin:4px 0 18px;font-size:1rem;}
  .modes{display:flex;flex-direction:column;gap:14px;}
  .mode-btn{border:none;cursor:pointer;font-family:'Itim',cursive;color:#fff;
    font-size:1.5rem;border-radius:22px;padding:20px;display:flex;align-items:center;gap:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s, box-shadow .08s;}
  .mode-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .mode-btn .ico{font-size:2.2rem;line-height:1;}
  .mode-add{background:linear-gradient(180deg,#ff86a2,var(--rocket));}
  .mode-seq{background:linear-gradient(180deg,#7fd0ff,var(--sky));}

  /* SETUP */
  .setup-h{font-family:'Itim',cursive;font-size:1.4rem;text-align:center;margin-bottom:4px;}
  .setup-h .tag{font-size:1.7rem;}
  .opt-label{font-family:'Itim',cursive;font-size:1.15rem;color:#6a5f95;margin:16px 0 8px;}
  .toggle{display:flex;gap:10px;}
  .toggle button{flex:1;border:3px solid #e3daff;background:#fff;cursor:pointer;
    font-family:'Itim',cursive;font-size:1.15rem;color:var(--ink);border-radius:18px;padding:14px 8px;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:.12s;}
  .toggle button .sub{font-family:'Mali';font-size:.8rem;color:#9086b5;}
  .toggle button.sel{border-color:var(--nebula);background:#f1e9ff;
    box-shadow:0 4px 0 rgba(176,107,255,.35);}
  .tip{margin-top:18px;background:#fff7dc;border-radius:16px;padding:12px 14px;
       font-size:.95rem;color:#8a6d1e;border:2px dashed #f0d67a;}
  .tip b{color:#6a5310;}
  .start-btn{margin-top:18px;width:100%;border:none;cursor:pointer;font-family:'Itim',cursive;
    color:#fff;font-size:1.6rem;border-radius:22px;padding:18px;
    background:linear-gradient(180deg,#c98bff,var(--nebula));
    box-shadow:0 6px 0 #7d3fc9;transition:transform .08s,box-shadow .08s;}
  .start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7d3fc9;}

  /* GAME */
  .prompt-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
  .prompt{font-family:'Itim',cursive;font-size:1.3rem;color:#6a5f95;text-align:center;}
  .speak{border:none;background:#efe6ff;cursor:pointer;border-radius:50%;width:42px;height:42px;
         font-size:1.2rem;flex:0 0 auto;box-shadow:0 3px 0 #d7c6ff;}
  .speak:active{transform:translateY(2px);box-shadow:0 1px 0 #d7c6ff;}

  .add-visual{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;}
  .grp{background:#fff;border-radius:20px;padding:12px 14px;box-shadow:inset 0 0 0 3px #ffe0b0;
       display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:150px;}
  .grp .dot{font-size:1.8rem;line-height:1;}
  .plus{font-family:'Itim',cursive;font-size:2.4rem;color:var(--rocket);}
  .equation{font-family:'Itim',cursive;font-size:2.2rem;text-align:center;margin:12px 0 2px;}
  .equation .q{color:var(--nebula);}

  /* space sequence */
  .track{padding:8px 2px 26px;overflow-x:auto;}
  .space-row{display:flex;align-items:center;gap:6px;justify-content:center;min-width:min-content;}
  .rocket{font-size:2.6rem;line-height:1;filter:drop-shadow(0 0 8px rgba(255,120,150,.7));}
  .planet{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Itim',cursive;font-size:1.9rem;color:#fff;flex:0 0 auto;
    box-shadow:0 4px 12px rgba(0,0,0,.25), inset -6px -6px 0 rgba(0,0,0,.12);}
  .dots{color:rgba(255,255,255,.5);font-size:1.4rem;flex:0 0 auto;}
  .p0{background:radial-gradient(circle at 35% 30%,#ffe98a,var(--star));color:#8a5a00;}
  .p1{background:radial-gradient(circle at 35% 30%,#ff9ab0,var(--rocket));}
  .p2{background:radial-gradient(circle at 35% 30%,#8ff0e0,var(--alien));color:#0a5a4c;}
  .p3{background:radial-gradient(circle at 35% 30%,#cfa6ff,var(--nebula));}
  .planet.mystery{background:#fff;color:var(--nebula);box-shadow:inset 0 0 0 4px #e0cbff,0 4px 12px rgba(0,0,0,.2);
    animation:float 1.4s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .choice{border:none;cursor:pointer;font-family:'Itim',cursive;font-size:2rem;color:var(--ink);
    background:#fff;border-radius:20px;padding:18px 0;box-shadow:0 5px 0 #d9cff0, inset 0 0 0 3px #ece3ff;
    transition:transform .08s, box-shadow .08s;}
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 #d9cff0, inset 0 0 0 3px #ece3ff;}
  .choice.good{background:var(--alien);color:#08544a;box-shadow:0 5px 0 #26b09a;animation:pop .35s;}
  .choice.bad{background:#ffd0da;color:var(--rocket);box-shadow:0 5px 0 #e79bab;animation:shake .35s;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .feedback{text-align:center;font-family:'Itim',cursive;font-size:1.5rem;min-height:2rem;margin-top:14px;}
  .feedback.win{color:#1fa38c;} .feedback.try{color:var(--rocket);}

  .foot{display:flex;justify-content:center;}
  .home-link{background:none;border:none;cursor:pointer;font-family:'Mali';font-size:1rem;
             color:#6a5f95;text-decoration:underline;padding:8px 12px;}

  .confetti{position:fixed;top:-10px;width:12px;height:16px;border-radius:3px;z-index:5;pointer-events:none;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  @media (max-width:380px){
    h1{font-size:1.7rem;} .planet{width:56px;height:56px;font-size:1.6rem;}
  }
  :focus-visible{outline:3px solid var(--star);outline-offset:2px;}
</style>
</head>
<body>
<div class="stars-bg" id="starsBg" aria-hidden="true"></div>

<div class="wrap">
  <header><h1>🚀 ผจญภัย<span class="em">อวกาศ</span></h1></header>
  <div id="status"></div>
  <div id="screen"></div>
</div>

<script>
(function(){
  const screen = document.getElementById('screen');
  const status = document.getElementById('status');

  // scatter background stars
  const bg = document.getElementById('starsBg');
  for(let i=0;i<40;i++){
    const s=document.createElement('div'); s.className='star-dot';
    const sz=1+Math.random()*2.5;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh';
    s.style.animationDelay=(Math.random()*3)+'s';
    bg.appendChild(s);
  }

  const state = { game:null, players:1, level:'easy', solo:0, p:[0,0], turn:0 };

  const emojis=['⭐','🪐','🚀','👽','🌟','☄️','🛸','🌙'];
  const rand=n=>Math.floor(Math.random()*n);
  const pick=a=>a[rand(a.length)];
  const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

  /* sounds */
  let actx=null;
  function tone(f,d,type='sine',when=0){
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
      const t=actx.currentTime+when;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d);
    }catch(e){}
  }
  const happy=()=>{tone(523,.15);tone(659,.15,'sine',.12);tone(784,.25,'sine',.24);};
  const oops =()=>tone(300,.18,'triangle');

  /* read aloud (Thai) */
  function speak(text){
    try{ if(!('speechSynthesis'in window))return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='th-TH';u.rate=.9;speechSynthesis.speak(u);
    }catch(e){}
  }

  function confetti(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const cols=['#ffd24d','#ff5c7a','#3fe0c5','#b06bff','#57c8ff'];
    for(let i=0;i<26;i++){
      const c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);
      c.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(c);
      const dur=1200+Math.random()*900;
      c.animate([{transform:c.style.transform,top:'-10px',opacity:1},{top:'100vh',opacity:.9}],
                {duration:dur,easing:'ease-in'});
      setTimeout(()=>c.remove(),dur);
    }
  }

  /* ---------- status bar ---------- */
  function renderStatus(){
    if(!state.game){ status.innerHTML=''; return; }
    if(state.players===1){
      const full=Math.min(5,Math.floor(state.solo/3));
      status.innerHTML=`<div class="bar"><span>คะแนน</span><strong>${state.solo}</strong>
        <span class="stars">${'⭐'.repeat(full)+'☆'.repeat(5-full)}</span></div>`;
    } else {
      status.innerHTML=`<div class="scoreboard">
        <div class="pchip ${state.turn===0?'active':''}"><div class="who">🧒 หนู</div><div class="pts">${state.p[0]}</div></div>
        <div class="pchip ${state.turn===1?'active':''}"><div class="who">🧑 ผู้ใหญ่</div><div class="pts">${state.p[1]}</div></div>
      </div>`;
    }
  }

  /* ================= HOME ================= */
  function home(){
    state.game=null; renderStatus();
    screen.innerHTML=`<div class="card">
      <div class="home-title">เลือกภารกิจ 🌌</div>
      <div class="home-sub">อยากผจญภัยแบบไหนดี?</div>
      <div class="modes">
        <button class="mode-btn mode-add" data-go="add"><span class="ico">➕</span><span>บวกดวงดาว</span></button>
        <button class="mode-btn mode-seq" data-go="seq"><span class="ico">🪐</span><span>ต่อแถวดาวเคราะห์</span></button>
      </div>
    </div>`;
    screen.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tone(660,.1);setup(b.dataset.go);});
  }

  /* ================= SETUP ================= */
  function setup(game){
    state.game=game; renderStatus();
    const title = game==='add' ? '➕ บวกดวงดาว' : '🪐 ต่อแถวดาวเคราะห์';
    const tip = game==='add'
      ? 'ชวนลูกนับของในกล่องออกเสียงทีละชิ้น แล้วถามว่า "รวมกันได้กี่ดวง?" การนับจริงสำคัญกว่าตอบเร็ว'
      : 'ถามลูกว่า "ตัวเลขเพิ่มทีละเท่าไหร่นะ?" ให้เด็กจับ<b>กฎของแถว</b>ให้ได้ นี่คือรากฐานของอนุกรมในอนาคต';
    screen.innerHTML=`<div class="card">
      <div class="setup-h">${title}</div>
      <div class="opt-label">เล่นกี่คน?</div>
      <div class="toggle" id="tgP">
        <button data-p="1" class="sel">🧒 คนเดียว<span class="sub">เล่นเอง</span></button>
        <button data-p="2">👨‍👧 สองคน<span class="sub">ผลัดกับพ่อแม่</span></button>
      </div>
      <div class="opt-label">ระดับความยาก</div>
      <div class="toggle" id="tgL">
        <button data-l="easy" class="sel">🐣 ง่าย<span class="sub">เริ่มต้น ป.1</span></button>
        <button data-l="mid">🚀 ปานกลาง<span class="sub">ท้าทายขึ้น</span></button>
      </div>
      <div class="tip">💡 <b>เคล็ดลับผู้ปกครอง:</b> ${tip}</div>
      <button class="start-btn" id="start">เริ่มเล่น! ✨</button>
      <div class="foot"><button class="home-link" id="back">← เลือกภารกิจใหม่</button></div>
    </div>`;
    const pick1=(box,attr,key)=>{
      screen.querySelector(box).querySelectorAll('button').forEach(b=>{
        b.onclick=()=>{ screen.querySelector(box).querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel'); state[key]=isNaN(+b.dataset[attr])?b.dataset[attr]:+b.dataset[attr]; tone(560,.07); };
      });
    };
    pick1('#tgP','p','players'); pick1('#tgL','l','level');
    document.getElementById('back').onclick=home;
    document.getElementById('start').onclick=()=>{
      tone(700,.12); state.solo=0; state.p=[0,0]; state.turn=0;
      renderStatus(); nextQuestion();
    };
  }

  function nextQuestion(){ state.game==='add'?addRound():seqRound(); }

  /* ============== ADDITION ============== */
  function addRound(){
    const cap = state.level==='easy'?9:15;
    let a=1+rand(Math.min(6,cap-1));
    let b=1+rand(Math.min(6,cap-a));
    const ans=a+b, em=pick(emojis.slice(0,4));
    const opts=new Set([ans]);
    while(opts.size<3){let d=ans+(rand(5)-2);if(d>0&&d!==ans)opts.add(d);}
    const choices=shuffle([...opts]);
    const dots=n=>Array.from({length:n},()=>`<span class="dot">${em}</span>`).join('');
    const promptText='มีทั้งหมดกี่ดวง? '+a+' บวก '+b;
    screen.innerHTML=`<div class="card">
      <div class="prompt-row">
        <div class="prompt">มีทั้งหมดกี่ดวง?</div>
        <button class="speak" id="say" aria-label="อ่านโจทย์">🔊</button>
      </div>
      <div class="add-visual">
        <div class="grp">${dots(a)}</div><span class="plus">+</span><div class="grp">${dots(b)}</div>
      </div>
      <div class="equation">${a} + ${b} = <span class="q">?</span></div>
      <div class="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="foot"><button class="home-link" id="home">🏠 กลับหน้าแรก</button></div>
    </div>`;
    document.getElementById('say').onclick=()=>speak(promptText);
    wire(ans);
  }

  /* ============== SEQUENCE ============== */
  function seqRound(){
    let step, maxVal;
    if(state.level==='easy'){ step=pick([1,1,2,2]); maxVal=12; }
    else { step=pick([1,2,2,3,-1,-2]); maxVal=20; }
    const len=5;
    let start;
    if(step>0){ const hi=maxVal-step*(len-1); start=1+rand(Math.max(1,hi-1)); }
    else { const lo=1-step*(len-1); start=lo+rand(Math.max(1,(maxVal-lo))); }
    const full=Array.from({length:len},(_,i)=>start+i*step);
    const hideIdx=1+rand(len-1);
    const ans=full[hideIdx];
    const opts=new Set([ans]);
    while(opts.size<3){let d=ans+Math.abs(step)*(rand(3)-1)+(rand(3)-1);if(d>0&&d!==ans)opts.add(d);}
    const choices=shuffle([...opts]);
    const planets=full.map((v,i)=> i===hideIdx
      ? `<div class="planet mystery" id="myp">?</div>`
      : `<div class="planet p${i%4}">${v}</div>`).join('<span class="dots">•••</span>');
    const dir = step<0?'ลดลง':'เพิ่มขึ้น';
    const promptText='ดาวเคราะห์หายไปหนึ่งดวง ใส่เลขอะไรดี ตัวเลข'+dir+'ทีละ '+Math.abs(step);
    screen.innerHTML=`<div class="card">
      <div class="prompt-row">
        <div class="prompt">ดาวหายไป 1 ดวง! 🌠</div>
        <button class="speak" id="say" aria-label="อ่านโจทย์">🔊</button>
      </div>
      <div class="track"><div class="space-row"><span class="rocket">🚀</span>${planets}</div></div>
      <div class="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="foot"><button class="home-link" id="home">🏠 กลับหน้าแรก</button></div>
    </div>`;
    document.getElementById('say').onclick=()=>speak(promptText);
    wire(ans,(v)=>{const m=document.getElementById('myp');if(m){m.classList.remove('mystery');m.classList.add('p'+(hideIdx%4));m.textContent=v;}});
  }

  /* ============== answer handling ============== */
  const cheersKid=['เก่งมาก! 🎉','สุดยอดหนู! ⭐','ถูกต้อง! 👏','ยอดเยี่ยม! 🌟'];
  const cheersAdult=['เยี่ยมเลยผู้ใหญ่! 🎉','แม่นมาก! ⭐','ถูกต้อง! 👏'];
  function turnLabel(){ return state.turn===0?'ตาหนูแล้ว! 🧒':'ตาคุณพ่อคุณแม่! 🧑'; }

  function wire(ans,onRight){
    const fb=document.getElementById('fb'); let done=false;
    screen.querySelectorAll('.choice').forEach(btn=>{
      btn.onclick=()=>{
        if(done)return;
        const v=parseInt(btn.dataset.v,10);
        if(v===ans){
          done=true; btn.classList.add('good'); if(onRight)onRight(v);
          happy(); confetti();
          if(state.players===1){ state.solo++; fb.textContent=pick(cheersKid); }
          else { state.p[state.turn]++; fb.textContent=pick(state.turn===0?cheersKid:cheersAdult); }
          fb.className='feedback win'; renderStatus();
          setTimeout(()=>{ if(state.players===2){ state.turn=1-state.turn; renderStatus();
              fb.textContent=turnLabel(); }
            nextQuestion();
          }, state.players===2?1600:1300);
        } else {
          btn.classList.add('bad'); oops();
          fb.className='feedback try'; fb.textContent='ลองอีกครั้งนะ 💪';
          setTimeout(()=>{btn.classList.remove('bad');fb.textContent='';},700);
        }
      };
    });
    document.getElementById('home').onclick=home;
  }

  home();
})();
</script>
</body>
</html>
